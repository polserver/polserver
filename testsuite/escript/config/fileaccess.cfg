# Deliberately not one allow-everything rule: the point of this file is that the access
# checks in filemod.cpp really run. filemod/access.src asserts what each rule refuses.
#
# Scripts run by runecl have no package of their own, so an unqualified path resolves
# against the working directory and a ":pkgname:" path needs AllowRemote.

# Core (unqualified) files: read only, and only the fixtures the suite actually reads -
# the xml documents in filemod/ and the listings the compiler writes for ast/funcexpr/opt.
FileAccess CoreTestFiles
{
	Package			*
	Directory		::filemod
	Directory		::./ast
	Directory		::./funcexpr
	Directory		::./opt
	Extension		.xml
	Extension		.ast
	Extension		.lst
	AllowRead		1
}

# Everything the two test packages own, reachable from any script.
FileAccess TestPackageFiles
{
	Package			*
	Directory		:filetest:
	Directory		:cfgtests:
	Extension		*
	AllowRead		1
	AllowRemote		1
	AllowWrite		1
	AllowAppend		1
}

# Applies only to scripts that live inside the filetest package, of which runecl has none -
# it grants nothing here and is present so the named-package rule path is exercised.
FileAccess PackageScriptsOnly
{
	Package			filetest
	Directory		*
	Extension		*
	AllowRead		1
}

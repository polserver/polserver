// A passive, invulnerable npc used as a party member. CreateParty and the
// PartyRef methods take any Character, and an npc never has a client - which is
// exactly what the refusals in this package need.
NPCTemplate party_npc
{
    Name                partyNPC
    MoveMode            L

    ObjType             0x190
    Color               1002
    TrueColor           1002
    Gender              0
    STR                 100
    INT                 100
    DEX                 100
    HITS                100
    MANA                100
    STAM                100

    Privs               invul
    Settings            invul
    AttackAttribute     Wrestling
    AttackSpeed         100
    AttackDamage        1
}

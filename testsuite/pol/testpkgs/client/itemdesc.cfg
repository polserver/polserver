// the counterpart of AttackableTarget, to tell the two apart on the wire
Item 0x40000D
{
    Name                NormalTarget
    Graphic             0x1
    MaxHP               10000
}

// A plain wearable item (graphic 0x1517 is a shirt, layer 5) for the effect tests.
// Worn, it has no place of its own, which is the whole point: everything said about
// where it is has to come from its wearer.
Item 0x400010
{
    Name                EffectShirt
    Graphic             0x1517
}

// attackable with a control script, so that the engage events are observable
Item 0x40000E
{
    Name                AttackableControlled
    Graphic             0x1
    Attackable          1
    ControlScript       control_attackable
    MaxHP               10000
}

// The test book. Everything about it - whether it can be written in, its title, its author and
// its pages - comes from its method script; the core asks the item rather than reading anything
// of its own. See bookmethods.src.
Item 0x400020
{
    Name                TestBook
    Graphic             0x1
    MethodScript        :TestClient:bookmethods
}

// A book with no method script at all, which is what an ordinary item looks like to SendOpenBook.
Item 0x400021
{
    Name                NotABook
    Graphic             0x1
}

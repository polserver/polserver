// Packet hooks for the packethook tests.
//
// every hook here has to be harmless to the rest of the suite: each
// one returns 0 - "I did not handle it, carry on" - until a test arms it through a
// global property, and every test disarms it again.
//
// 0x77 is the fixed length side of the outgoing hook: the core sends it whenever a
// mobile that a client can already see moves.
Packet 0x77
{
    Length 17
    SendFunction packethook:UpdatePlayer_0x77
}

// The same packet again as version 2, for clients from 6.0.0.0 on. Every client
// the suite connects is newer than that, so this entry is the one the core has to
// choose - which is what tells version selection apart from a plain hook.
Packet 0x77
{
    Length 17
    SendFunction packethook:UpdatePlayer_0x77_V2
    Version 2
    Client 6.0.0.0
}

// 0x1C is the variable length side: plain text speech and system messages. Its
// text runs to the end of the packet, so rewriting it is what exercises resizing
// and the encoded length that goes out with it.
Packet 0x1C
{
    Length variable
    SendFunction packethook:Speech_0x1C
}

// And the mirror image: a version 2 entry for a client newer than any the suite
// connects, so the version 1 entry above stays in charge.
Packet 0x1C
{
    Length variable
    SendFunction packethook:Speech_0x1C_V2
    Version 2
    Client 8.0.0.0
}

// 0x34 is the incoming side, a client asking for a status. Its request type byte
// sits at offset 5, which makes it a parent packet with subcommands: the basic
// status request (0x04) is hooked on its own below, everything else - the skill
// request (0x05) - falls through to the parent function here.
Packet 0x34
{
    Length 10
    SubCommandOffset 5
    SubCommandLength 1
    ReceiveFunction packethook:StatusRequest_0x34
}

SubPacket 0x34
{
    SubCommandID 0x04
    ReceiveFunction packethook:StatusBase_0x34
}

// 0x5D is the character selection, which arrives before the client has a character
// at all. Its hook is the one that cannot be armed or disarmed: it fires while the
// suite's own clients log in, so it only ever records and passes the packet on.
Packet 0x5D
{
    Length 73
    ReceiveFunction packethook:CharSelect_0x5D
}

// A fourth vital, owned by the testsuite, so that the depleted hook, the
// aliases and the regeneration paths can be exercised without changing the
// vitals of the bare distro.
//
// It is deliberately inert for every character that a test did not mark with
// the #VitalTest property: the maximum is a constant and the regen rate is 0,
// so it never depletes on its own and the hook never records anything.
Vital TestVital
{
	Alias				TestVitalAlias
	RegenRateFunction	:testvitals:vitalhooks:GetTestVitalRegenRate
	MaximumFunction		:testvitals:vitalhooks:GetTestVitalMaximumValue
	DepletedFunction	:testvitals:vitalhooks:OnTestVitalDepleted
	RegenWhileDead		1
}

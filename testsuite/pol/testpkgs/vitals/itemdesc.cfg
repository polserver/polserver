// Character::resurrect() equips a death robe without checking that it can be
// equipped first, unlike Character::on_death() which guards the same call for
// the death shroud. If the robe is not equippable the passert in
// Character::equip() shuts the whole server down.
//
// The tiledata that poltool generates for the test environment gives no tile
// the robe layer (22), so the stock death robe cannot be equipped and any
// resurrection aborts the shard. This entry gives it a graphic that does carry
// an equip layer, which keeps the death and resurrection paths usable for
// every test package, not only this one.
// The graphic is movable in the tiledata, which the item move tests rely on
// for this objtype. That also means it reaches clients with the movable flag
// set, which test_client_seeinvisitems.src takes into account.
Item 0x1F03
{
    Name                death robe
    Graphic             0x152E
}

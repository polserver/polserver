// A passive npc with known attributes, so that the vital maximums derived from
// them are predictable. Not invul, so that damage tests can reach it.
//
// See itemdesc.cfg for the death robe entry that makes resurrection work in
// the test environment at all.
NPCTemplate test_vitals
{
    Name                testVitals
    Script              ai_idle
    MoveMode            L

    ObjType             0x190
    Color               1002
    TrueColor           1002
    Gender              0
    STR                 100
    INT                 90
    DEX                 80
    HITS                100
    MANA                90
    STAM                80

    AttackAttribute     Wrestling
    AttackSpeed         100
    AttackDamage        1
}

// the same, but invulnerable, to check that damage is refused
NPCTemplate test_vitals_invul
{
    Name                testVitalsInvul
    Script              ai_idle
    MoveMode            L

    ObjType             0x190
    Color               1002
    TrueColor           1002
    Gender              0
    STR                 100
    INT                 90
    DEX                 80
    HITS                100
    MANA                90
    STAM                80

    Privs               invul
    Settings            invul
    AttackAttribute     Wrestling
    AttackSpeed         100
    AttackDamage        1
}

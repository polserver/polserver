{
  Name testhouse_container
  Graphic 0xe75
  Gump 0x3c
  MinX 1
  MinY 1
  MaxX 10
  MaxY 10
  // A house door weighs whatever its tile says, which is far past a default container's limit.
  MaxWeight 65535
  MaxItems 255
}

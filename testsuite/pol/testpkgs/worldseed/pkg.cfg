# Seeds the world with item location alternatives that no other package leaves behind, so
# that the shard_test_roundtrip test has something to compare. Anything not represented in
# the saved world is not covered by that gate, however green it reports.
#
# Named to sort after the client package, like testslowreader: testclient.py gives POL 30
# seconds to connect before it exits. This package is fast, but the ordering costs nothing.
name testworldseed
enabled 1

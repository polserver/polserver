# Deliberately has no Script: the seeded NPCs must sit still. The round-trip pass compares
# a save against a save of the same world after a reload, so an NPC that walks a step in
# between would turn that comparison red.

NPCTemplate seed_npc
{
    Name                seedNPC
    MoveMode            L

    ObjType             0x190
    Color               1002
    TrueColor           1002
    Gender              0
    STR                 200
    INT                 200
    DEX                 200
    HITS                200
    MANA                200
    STAM                200

    AttackAttribute     Wrestling
    AttackDelay         80
    AttackDamage        1d5
}

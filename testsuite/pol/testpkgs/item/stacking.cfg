#
# The per-package half of load_stacking_cfg(): every package is checked for a stacking.cfg,
# and what it declares joins the same shard-wide Global_Ignore_CProps set the core config
# fills. Two names are used so a test can tell the two sources apart.
#
# The list is space separated, and read_stacking_cfg() only ever reads the first element of
# the file.
#

Stacking
{
    IgnoreCprops    TestStackIgnorePkg TestStackIgnorePkg2
}

// A plain item the tiledata does not mark stackable. CreateItemInInventory force stacks, so
// this is how a stack of something unstackable comes about - the case the split methods keep
// a separate loop for, cloning one item at a time instead of splitting an amount off.
Item 0x200030
{
  Name            plain_unstackable
  Graphic         0x1517
  Weight          1
}

// Lockable on an itemdesc that is neither a container nor a door is the only way the core builds
// a bare ULockable - everything else that can be locked is one of its subclasses.
Item 0x200031
{
  Name            plain_lockable
  Graphic         0x1517
  Lockable        1
}

// The property arms of the ItemDesc constructor that no other entry in the suite walks, all in
// one item so that a single GetItemDescriptor() reads them back:
//
//   StackLimit  above the core's ceiling, which is clamped rather than kept
//   Tooltip     longer than a tooltip packet can carry, which is truncated
//   Weight      the fraction form, which is the only path through the '/' arm of the parser
//   Resource    the only key that builds a ResourceComponent (testres comes from
//               regions/resource.cfg)
//   CProp       an itemdesc-level cprop, which reaches the descriptor as a dictionary
//
// StackingIgnoresCProps is this item's own list and has nothing to do with the shard-wide one
// config/stacking.cfg fills -- a space separated list read into a set of its own.
Item 0x200032
{
  Name                  desc_property_probe
  Graphic               0x1517
  StackingIgnoresCProps ProbeIgnoreA ProbeIgnoreB
  StackLimit            65000
  Tooltip               AAAAAAAAAABBBBBBBBBBCCCCCCCCCCDDDDDDDDDDEEEEEEEEEEFFFFFFFFFFGGGGGGGGGGHHHHHHHHHHIIIIIIIIIIJJJJJJJJJJKKKKKKKKKKLLLLLLLLLLMMMMMMMMMMNNNNNNNNNNOOOOOOOOOOPPPPPPPPPPQQQQQQQQQQRRRRRRRRRRSSSSSSSSSSTTTTTTTTTTUUUUUUUUUUVVVVVVVVVVWWWWWWWWWWXXXXXXXXXXYYYYYYYYYYZZZZZZZZZZ0000000000
  Weight                1/4
  Resource              testres 3
  CProp                 ProbeNumber i5
  StrProp               ProbeText Hello
}

// A weapon that sets every key WeaponDesc reads, so that reading it back through
// GetItemDescriptor() checks values rather than a row of zeroes. Projectile is what opens the
// three ProjectileX keys -- without it the constructor never looks for them.
Weapon 0x200033
{
  Name            desc_weapon_probe
  Graphic         0x1515
  Attribute       Archery
  Damage          2d6+1
  Speed           40
  MaxHp           50
  Anim            0x09
  MountedAnim     0x1b
  HitSound        0x23b
  MissSound       0x239
  TwoHanded       1
  Projectile      1
  ProjectileType  0x1bfb
  ProjectileAnim  0x1b
  ProjectileSound 0x224
  MinRange        3
  MaxRange        12
}


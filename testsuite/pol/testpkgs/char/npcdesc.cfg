// A flying NPC. Nothing else on the shard has one, and movemode has no setter in script, so a
// template is the only way to get a character whose flying can be taken away again - which is
// what changing race away from gargoyle does.
NPCTemplate test_flyer
{
    Name                testFlyer
    MoveMode            LF

    ObjType             0x190
    Color               1002
    TrueColor           1002
    Gender              0
    STR                 100
    INT                 100
    DEX                 100
    HITS                100
    MANA                100
    STAM                100
}

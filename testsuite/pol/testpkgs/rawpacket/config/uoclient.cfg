# A second game listener that takes the PROXY protocol v2 header from the loopback address, for
# test_rawpacket_proxy.src. The client listener on 5003 has no AllowProxy, so nothing else changes.
Listener	proxy-5023
{
	Port		5023
	Encryption	none
	AOSResistances	0
	KeepClients	1
	AllowProxy	127.0.0.1
}

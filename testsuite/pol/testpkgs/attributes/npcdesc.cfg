// A passive npc with literal, non-random attributes, so that the values the
// tests read back are predictable. npcdesc counts whole points, the core
// stores tenths, so STR 100 here is a base value of 1000.
NPCTemplate attr_npc
{
    Name                attrNPC
    MoveMode            L

    ObjType             0x190
    Color               1002
    TrueColor           1002
    Gender              0
    STR                 100
    INT                 90
    DEX                 80
    HITS                100
    MANA                90
    STAM                80

    Alchemy             50

    Privs               invul
    Settings            invul
    AttackAttribute     Wrestling
    AttackSpeed         100
    AttackDamage        1
}

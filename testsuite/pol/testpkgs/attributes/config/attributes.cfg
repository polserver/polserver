// Two attributes owned by the testsuite, so that the parts of attributes.em
// that depend on the configuration of an attribute can be exercised without
// touching the attributes of the bare distro.
//
// Neither has an entry in uoskills.cfg, so neither carries a skill id - which
// is what makes them the "has no skill id defined" case of CheckSkill.

// Carries an alias and a cap of its own, unlike every distro attribute, which
// all fall back to the DefaultAttributeCap of servspecopt.cfg.
Attribute TestAttr
{
	Alias		TestAttrAlias
	DefaultCap	500
}

// The only attribute in the test shard with an intrinsic modifier hook. The
// hook is inert for every character that a test did not mark with the
// #AttrIntrinsicMod property, so it cannot disturb the rest of the testsuite.
Attribute TestAttrIntrinsic
{
	GetIntrinsicModFunction	:testattributes:attrhooks:GetTestIntrinsicMod
}

// The only attribute in the test shard with a skill script, which is what
// Start_Skill_Script runs when it is not given a script name of its own.
// DisableCoreChecks is what lets it be used by a mobile with no client.
Attribute TestSkillAttr
{
	Script			scripts/skills/testskill
	DisableCoreChecks	1
}

// Names a skill script that no .ecl was ever compiled to. An attribute's own script is not
// checked for existence before it is loaded, so this is the "could not be read" path.
Attribute TestSkillMissingAttr
{
	Script			scripts/skills/nosuchskill
	DisableCoreChecks	1
}

// A passive, invulnerable npc used as a guild member. Guild membership is a
// property of Character, not of players, so an npc is the cheapest member the
// tests can create and throw away.
NPCTemplate guild_npc
{
    Name                guildNPC
    MoveMode            L

    ObjType             0x190
    Color               1002
    TrueColor           1002
    Gender              0
    STR                 100
    INT                 100
    DEX                 100
    HITS                100
    MANA                100
    STAM                100

    Privs               invul
    Settings            invul
    AttackAttribute     Wrestling
    AttackSpeed         100
    AttackDamage        1
}

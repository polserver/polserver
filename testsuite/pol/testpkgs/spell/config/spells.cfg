#############################################################################
## Spells
#############################################################################
#
# The spells the shard knows. Ids are hardcoded per school in the core:
# magery 1+, necro 101+, paladin 201+, bushido 401+, ninjitsu 501+,
# spellweaving 601+, mysticism 678-693.
#
# Id 5 is deliberately left undefined: an id inside the table with no spell
# behind it is what the module functions answer "No such spell" for, and the
# only way to reach that branch. Everything from here to 678 is likewise a
# hole, since register_spell grows the table to the highest id defined.
#
# See ../../../config/circles.cfg for the circles two of these draw from.
#

Spell 1
{
    SpellID     1
    Name        TestSpellCircle
    PowerWords  Uus Test Mani
    Script      scripts/spelleffect
    Circle      1
}

Spell 2
{
    SpellID     2
    Name        TestSpellParams
    PowerWords  In Test Ylem
    Script      scripts/spelleffect
    Mana        9
    Difficulty  33
    PointValue  70
    Delay       3
}

Spell 3
{
    SpellID     3
    Name        TestSpellReagents
    PowerWords  Kal Test Flam
    Script      scripts/spelleffect
    Circle      2
    Reagent     TestReagentAsh
    Reagent     TestReagentMoss
}

Spell 4
{
    SpellID     4
    Name        TestSpellNoScript
    PowerWords  Des Test Sanct
    Circle      1
}

# spell 7 is the one a scroll at objtype 0x1F2D carries - the core swaps the
# first seven magery scrolls, so the lowest objtype is not the lowest spell
Spell 7
{
    SpellID     7
    Name        TestSpellSeven
    PowerWords  Rel Test Por
    Script      scripts/spelleffect
    Circle      1
}

Spell 101
{
    SpellID     101
    Name        TestSpellNecro
    PowerWords  Corp Test Wis
    Script      scripts/spelleffect
    Circle      2
}

Spell 678
{
    SpellID     678
    Name        TestSpellMysticism
    PowerWords  Vas Test Ort
    Script      scripts/spelleffect
    Circle      1
}

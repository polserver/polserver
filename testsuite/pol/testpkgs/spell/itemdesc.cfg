// Spell scrolls only exist at the objtypes the core hardcodes
// (gamestate.spell_scroll_objtype_limits, globals/uvars.cpp): magery
// 0x1F2D-0x1F6C, necro 0x2260-0x226F. An item outside those ranges is not a
// scroll whatever its itemdesc says, and a spellbook takes scrolls only from
// its own school's range.
//
// The core swaps the first seven magery scrolls
// (USpellScroll::convert_objtype_to_spellnum), so the lowest objtype carries
// spell 7 and the second carries spell 1.

// spell 7
SpellScroll 0x1F2D
{
    Name        TestScrollSeven
    Graphic     0xf3f
    SpellType   Magic
}

// spell 1
SpellScroll 0x1F2E
{
    Name        TestScrollOne
    Graphic     0xf3f
    SpellType   Magic
}

// spell 8, the first objtype past the swap
SpellScroll 0x1F34
{
    Name        TestScrollEight
    Graphic     0xf3f
    SpellType   Magic
}

// necro spell 101
SpellScroll 0x2260
{
    Name        TestScrollNecro
    Graphic     0xf3f
    SpellType   Necro
}

// The books. Graphic 0xEFA is generated with layer 1, the hand the core looks
// in for a spellbook, so these can be held as well as carried.
Spellbook 0x210001
{
    Name        TestBookMagic
    Graphic     0xefa
    SpellType   Magic
    Gump        0x3c
    MinX        44
    MinY        65
    MaxX        186
    MaxY        159
}

// The one book with a method script of its own, which is consulted before the
// Spellbook class script of syshook.cfg.
Spellbook 0x210002
{
    Name        TestBookNecro
    Graphic     0xefa
    SpellType   Necro
    MethodScript :testspell:method-scripts/itemdesc
    Gump        0x3c
    MinX        44
    MinY        65
    MaxX        186
    MaxY        159
}

Spellbook 0x210003
{
    Name        TestBookMysticism
    Graphic     0xefa
    SpellType   Mysticism
    Gump        0x3c
    MinX        44
    MinY        65
    MaxX        186
    MaxY        159
}

Spellbook 0x210004
{
    Name        TestBookBushido
    Graphic     0xefa
    SpellType   Bushido
    Gump        0x3c
    MinX        44
    MinY        65
    MaxX        186
    MaxY        159
}

// The reagents spell 3 asks for, by the name spells.cfg names them with.
// Graphic 0xEED is stackable, so a stack can be watched dropping by one.
Item 0x210005
{
    Name        TestReagentAsh
    Graphic     0xeed
}

Item 0x210006
{
    Name        TestReagentMoss
    Graphic     0xeed
}

// not a scroll, for what a spellbook refuses
Item 0x210007
{
    Name        TestSpellPlainItem
    Graphic     0xf3f
}

// something other than a book to fill the casting hand with
Item 0x210008
{
    Name        TestSpellSword
    Graphic     0xf5e
}

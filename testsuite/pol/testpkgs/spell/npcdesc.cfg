// A passive npc with known mana, so that what a spell consumes is
// predictable. No Script: a spell script is started attached, and a character
// that already carries an attached script cannot start one.
NPCTemplate spell_npc
{
    Name                spellNPC
    MoveMode            L

    ObjType             0x190
    Color               1002
    TrueColor           1002
    Gender              0
    STR                 100
    INT                 90
    DEX                 80
    HITS                100
    MANA                90
    STAM                80

    Privs               invul
    Settings            invul
    AttackAttribute     Wrestling
    AttackSpeed         100
    AttackDamage        1
}

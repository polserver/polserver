# Alignment is a property of the shared NpcTemplate and has no setter, so the
# three branches of the NPC dispatch in repsys.cpp each need a template of their
# own. Everything else about them is the probe_npc of the TestNpc package.
#
# They are invul because a rep case may leave two of them standing next to each
# other with an opponent set; nothing here is meant to win a fight.

NPCTemplate rep_good
{
    Name                repGoodNPC
    MoveMode            L
    Alignment           good

    ObjType             0x190
    Color               1002
    TrueColor           1002
    Gender              0
    STR                 200
    INT                 200
    DEX                 200
    HITS                200
    MANA                200
    STAM                200

    Privs               invul
    Settings            invul
    AttackAttribute     Wrestling
    AttackSpeed         80
    AttackDamage        1
}


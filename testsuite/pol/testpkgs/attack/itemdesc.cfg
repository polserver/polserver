// Ammunition for TestBow, stacked in a pack so each shot takes one from the stack.
Item 0x40A000
{
  Name TestArrow
  Graphic 0xF3F
  Movable 1
}

// A bow that shoots TestArrow. The hit script is the package's own, so every shot that lands
// reports to the test that owns the attacker. 0xEFA is the only graphic the generated tiledata
// puts in a hand, and a weapon is a weapon by its element here, not by its graphic.
Weapon 0x40A001
{
  Name TestBow
  Graphic 0xEFA
  Attribute Wrestling
  Damage 1d4
  Speed 50
  Projectile 1
  ProjectileType 0x40A000
  ProjectileAnim 0xF42
  ProjectileSound 0x234
  MinRange 0
  MaxRange 12
  HitScript :testattack:attackhitscript
  MaxHP 50
}

// A shield whose armor rating is above anything the test_attack npc can deal, so a parried
// hit does no damage at all. Worn in a hand, which is what makes it the npc's shield.
Armor 0x40A002
{
  Name TestShield
  Graphic 0xEFA
  AR 100
  MaxHP 50
}

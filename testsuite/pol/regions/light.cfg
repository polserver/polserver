#############################################################################
## Light regions
#############################################################################
#
# Read by testpkgs/misc/test_uoregion.src.
#
# The moment this file exists the core builds a background light region for
# itself out of an empty config element, and that one gets LightLevel 0. Before
# it existed every location fell through to servspecopt's DefaultLightLevel of
# 10 instead. So the two base regions below repaint each realm in full at that
# same 10, which leaves the shard's effective light exactly as it was: a client
# anywhere outside TestLightDark still gets 10, and no other package has to care
# that light regions now exist at all.
#
# Zones are painted a zone at a time (ZONE_SIZE is 4) and later regions
# overwrite earlier ones, so TestLightDark has to come last and its range is
# aligned to that grid -- it really does cover exactly 108..115 in both axes.
# That patch is a corner of the map no client goes near.
#
# britannia is 192x192 and britannia2 is 1600x1600; a range that runs past a
# realm's edge is a load error rather than a warning.
#

LightRegion TestLightBase
{
    Realm       britannia
    Range       0 0 191 191
    LightLevel  10
}

LightRegion TestLightBase2
{
    Realm       britannia2
    Range       0 0 1599 1599
    LightLevel  10
}

LightRegion TestLightDark
{
    Realm       britannia
    Range       108 108 115 115
    LightLevel  25
}

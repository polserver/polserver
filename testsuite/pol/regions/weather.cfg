#############################################################################
## Weather regions
#############################################################################
#
# Read by testpkgs/misc/test_uoregion.src.
#
# Unlike light.cfg no base region is needed here. Before this file existed
# weatherdef held no regions at all, so every location answered nullptr and a
# client crossing a region boundary was sent "weather off" -- send_weather(
# 0xff, 0, 0 ). The background region the core now builds for itself out of an
# empty config element defaults to WeatherType 255 (which means *no* weather,
# not type 0), severity 0, aux 0 and LightOverride -1, so it produces the same
# bytes and cannot hijack the light path at ufunc.cpp:1728.
#
# TestWeatherStorm is the one region a test writes to. It sits in the open
# water off the south-east corner, which is grass to nobody and where no client
# ever goes: a client that walks into a weather region is sent a weather packet,
# and 100,100 -- the most-used coordinate on this shard -- must stay clear of
# one. Zones are painted a zone at a time (ZONE_SIZE is 4), so the range below
# is aligned to that grid and really does cover exactly 176..179 in both axes.
#
# The rect that AssignRectToWeatherRegion moves about at runtime is the
# neighbouring 184..187, which is deliberately *not* named here: assigning it
# has to change something, and the empty-name form puts it back to whatever
# copy_default_regions captured at load time.
#

WeatherRegion TestWeatherStorm
{
    Realm            britannia
    Range            176 176 179 179
    WeatherType      1
    WeatherSeverity  10
    WeatherAux       0
    LightOverride    -1
}

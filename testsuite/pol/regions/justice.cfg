#############################################################################
## Justice regions
#############################################################################
#
# A named justice region with no texts, so that GetRegionName and
# GetRegionNameAtLocation have a name to answer with at all. Everywhere else
# falls into the background region the core builds for itself from an empty
# config element: unguarded, combat allowed, items decay, and an empty name.
#
# Regions are painted a zone at a time (ZONE_SIZE is 4), so the range below is
# aligned to that grid and really does cover exactly 132..139 in both axes. It
# is grass at z 0 -- the generated map is water only outside 28..163 -- and no
# other package's fixtures stand there: see JR_X/JR_Y in
# testpkgs/misc/test_uoregion.src, which is the only thing that looks here.
#
# EnterText, LeaveText, Guarded and NoCombat are deliberately left at their
# defaults. A logged-in client that crosses a region boundary is told about it,
# and the client tests expect no such message.
#

JusticeRegion TestJustice
{
    Range   132 132 139 139
}

#
# Three more for test_client_justice.src, on the zone grid at x 144..155, y 132..135 and away
# from every other fixture. That test is the only one that stands a client in them, since their
# texts would reach any client that walked in.
#
# JusticeA and JusticeB share their texts, so crossing from one to the other says nothing. Both
# run :testclient:regionscript, which records who crossed which region.
#

JusticeRegion JusticeA
{
    Range       144 132 147 135
    EnterText   You enter the test region.
    LeaveText   You leave the test region.
    EnterScript :testclient:regionscript
    LeaveScript :testclient:regionscript
}

JusticeRegion JusticeB
{
    Range       148 132 151 135
    EnterText   You enter the test region.
    LeaveText   You leave the test region.
    EnterScript :testclient:regionscript
    LeaveScript :testclient:regionscript
}

JusticeRegion JusticePeace
{
    Range       152 132 155 135
    NoCombat    1
    EnterText   You enter a peaceful place.
    LeaveText   You leave the peaceful place.
}

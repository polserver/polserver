#############################################################################
## No-cast regions
#############################################################################
#
# The one region on this shard that refuses spells, so that do_cast's
# "Spells cannot be cast here." branch can be reached at all. Everything
# outside it falls into the background region the core makes for itself, which
# has nocast off.
#
# Regions are painted a zone at a time (ZONE_SIZE is 4), so the range below is
# aligned to that grid and really does cover exactly 160..167 in both axes. It
# is well clear of everywhere the tests stand: see NOCAST_X/NOCAST_Y in
# testpkgs/client/spellcast.inc, which is the only thing that walks into it.
#

NoCastRegion TestNoCast
{
    Range   160 160 167 167
    nocast  1
}

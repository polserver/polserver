# Party settings for the test shard.
#
# None of this is reloadable - load_config() is only ever called at startup, so
# ReloadConfiguration() does not re-read this file and the values below hold for
# the whole run. They are picked so that the party tests in the TestClient
# package can reach the behaviour they guard:
#
#   TreatNoAsPrivate  a public message beginning with a digit and a space is
#                     routed to that member slot instead. Public-chat tests must
#                     not begin their text that way.
#   DeclineTimeout    seconds an invitation stands before it declines itself.
#                     Kept short so the test for it does not stall the run, but
#                     not as short as it will go: it bounds every invitation, and
#                     party_invite_refusals answers one only after four client
#                     round trips. At 1 second that sequence would be racing the
#                     timer, and an invitation that declines itself mid-case
#                     fails somewhere else entirely.
#   PrivateMsgPrefix  the core appends a space of its own, so private messages
#                     arrive as "P: <text>".
#
# The hooks all live in one script, which records what it was called with and
# refuses only when a test asks it to.

General
{
	MaxPartyMembers		10
	TreatNoAsPrivate	1
	DeclineTimeout		2
	PrivateMsgPrefix	P:
	RemoveMemberOnLogoff	0
}

HookList
{
	CanAddToParty		:testclient:partyhook:CanAddToPartyHook
	CanRemoveMember		:testclient:partyhook:CanRemoveMemberHook
	CanLeaveParty		:testclient:partyhook:CanLeavePartyHook
	OnPartyCreate		:testclient:partyhook:OnPartyCreateHook
	OnAddToParty		:testclient:partyhook:OnAddToPartyHook
	OnLeaveParty		:testclient:partyhook:OnLeavePartyHook
	OnDecline		:testclient:partyhook:OnDeclineHook
	OnDisband		:testclient:partyhook:OnDisbandHook
	OnLootPermChange	:testclient:partyhook:OnLootPermChangeHook
	OnPublicChat		:testclient:partyhook:OnPublicChatHook
	OnPrivateChat		:testclient:partyhook:OnPrivateChatHook
	ChangePublicChat	:testclient:partyhook:ChangePublicChatHook
	ChangePrivateChat	:testclient:partyhook:ChangePrivateChatHook
}

#
# Movement stamina cost for the test shard.
#
# servspecopt.cfg sets MovementUsesStamina 1, so Character::move() calls movecost() on every
# step -- but without this file load_movecost() (movecost.cpp) returns at its FileExists check
# and every cost stays at the value-initialised 0.0 from Settings' constructor.
#
# The multipliers below are therefore all 0.0: movement on the test shard stays free, exactly
# as it was before this file existed. That matters -- a character with no stamina (every
# offline PC, RecalcVitals refuses them) would otherwise be unable to move at all, and the
# client tests walk constantly.
#
# The five element types are all present because each is a separate branch of load_movecost().
# The two entries per element are the ends of the interpolation range read_movecost() fills:
# every carrying percentage from 0 to MAX_CARRY_PERC gets a cost interpolated between them.
#

MovementCost
{
    0       0.0
    200     0.0
}

Walking
{
    0       0.0
    200     0.0
}

Running
{
    0       0.0
    200     0.0
}

Walking_Mounted
{
    0       0.0
    200     0.0
}

Running_Mounted
{
    0       0.0
    200     0.0
}

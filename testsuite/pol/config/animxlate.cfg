#
# Animation translations for the test shard.
#
# Without this file load_anim_xlate_cfg() (bowsalut.cpp) returns at its FileExists check:
# every animation sent to a client logs "undefined animXlate.cfg entry for graphic 0x190",
# and a mounted character sends no animation at all, because mount_action_xlate is memset
# to zero and send_action_to_inrange() drops an action that translates to 0.
#
# The MobileType Human entries below are identity mappings, and the loader's defaults for a
# single-value OldAnim entry (framecount 5, repeatcount 1, forward, norepeat, delay 1) are
# exactly what send_action_to_inrange() passes when a caller does not override them, so an
# unmounted character puts the same bytes on the wire as it did before this file existed.
#

# Action played instead when the character is mounted. Actions 0x17..0x1D are the riding
# animations themselves and are never translated, so they are not listed.
OnMount
{
    0x00    0x17
    0x01    0x17
    0x02    0x18
    0x03    0x18
    0x04    0x1d
    0x05    0x1d
    0x06    0x1d
    0x07    0x1d
    0x08    0x1d
    0x09    0x1a
    0x0a    0x1a
    0x0b    0x1a
    0x0c    0x1a
    0x0d    0x1a
    0x0e    0x1a
    0x0f    0x1d
    0x10    0x1a
    0x11    0x1a
    0x12    0x1b
    0x13    0x1c
    0x14    0x1d
    0x15    0x1d
    0x16    0x1d
    0x1e    0x1d
    0x1f    0x1d
    0x20    0x1d
    0x21    0x1d
    0x22    0x1d
}

# 0x190 and 0x191 are the only mobile graphics the test shard uses: every NPC template
# declares ObjType 0x190 and a created character is one of the two.
MobileType Human
{
    Graphic             0x190
    Graphic             0x191
    MountTranslation    1

    # The new form of the animation packet, which is the only one a 7.0.9.0 client is sent.
    # Without these the core finds this translation, builds nothing, and sends that client
    # no animation at all - see MobileAnimationMsg::Send. Values are the shipped
    # pol-core/support/animxlate.cfg Human block; the OldAnim identity mappings above are
    # kept as they were, so an older client still sees exactly what it saw before.
    OldAnim0    0x00
    NewAnim0   7 2
    OldAnim1    0x01
    NewAnim1   7 2
    OldAnim2    0x02
    NewAnim2   7 2
    OldAnim3    0x03
    NewAnim3   7 2
    OldAnim4    0x04
    NewAnim4   5 0 1
    OldAnim5    0x05
    NewAnim5   5 0 0
    OldAnim6    0x06
    NewAnim6   5 0 1
    OldAnim7    0x07
    OldAnim8    0x08
    OldAnim9    0x09
    NewAnim9   0
    OldAnim10   0x0a
    NewAnim10  0 5
    OldAnim11   0x0b
    NewAnim11  0 6
    OldAnim12   0x0c
    NewAnim12  0 7
    OldAnim13   0x0d
    NewAnim13  0 4
    OldAnim14   0x0e
    NewAnim14  0 8
    OldAnim15   0x0f
    NewAnim15  0 7
    OldAnim16   0x10
    NewAnim16  11 0
    OldAnim17   0x11
    NewAnim17  11 1
    OldAnim18   0x12
    NewAnim18  0 1
    OldAnim19   0x13
    NewAnim19  0 2
    OldAnim20   0x14
    NewAnim20  4 0
    OldAnim21   0x15
    NewAnim21  3 0 1
    OldAnim22   0x16
    NewAnim22  3 0 0
    OldAnim23   0x17
    NewAnim23  7 2
    OldAnim24   0x18
    NewAnim24  7 2
    OldAnim25   0x19
    NewAnim25  5 0 1
    OldAnim26   0x1a
    NewAnim26  0 6
    OldAnim27   0x1b
    NewAnim27  0 1
    OldAnim28   0x1c
    NewAnim28  0 2
    OldAnim29   0x1d
    NewAnim29  0 0 2
    OldAnim30   0x1e
    NewAnim30  2 0
    OldAnim31   0x1f
    NewAnim31  0 0
    OldAnim32   0x20
    NewAnim32  7 0
    OldAnim33   0x21
    NewAnim33  7 1
    OldAnim34   0x22
    NewAnim34  6 0
}

# No mobile on the test shard has graphic 0x00c8, so this entry changes nothing on the wire.
# It is here for the two entry forms the Human block does not use: the six-value OldAnim
# (action, framecount, repeatcount, backward, repeatflag, delay) and the three-value NewAnim
# (anim, action, subaction), which is what a post-SA client is sent instead.
MobileType TestCreature
{
    Graphic             0x00c8
    MountTranslation    0

    OldAnim0    0x00 6 2 1 1 2
    OldAnim2    0x02 6
    NewAnim0    0x00 1 2
    NewAnim2    0x02
}

#############################################################################
## Spell circles
#############################################################################
#
# A spell naming a Circle takes its Mana, Difficulty, PointValue and Delay
# from that circle instead of from its own entry. The two circles here carry
# distinct values so that a spell can be told apart from the circle it came
# from, and from the spells that spell out their own parameters.
#
# See testpkgs/spell/config/spells.cfg for the spells that use them.
#

Circle 1
{
    Mana        4
    Difficulty  10
    PointValue  50
    Delay       1
}

Circle 2
{
    Mana        6
    Difficulty  20
    PointValue  100
    Delay       2
}

#
# Static item menus. Without this file Menu::read_menus() (menu.cpp) returns at its
# FileExists check, gamestate.menus stays empty, and both find_menu() overloads plus the
# submenu resolution pass below are unreachable -- a script can only ever hand
# GetMenuObjTypes()/SelectMenuItem() a dynamic CreateMenu() handle.
#
# Note the entry format is what the parser reads, not what its own error message claims:
#   SubMenu     <submenu name> <objtype> <title...>
#   Entry       <objtype> <title...>
# The title is the rest of the line and may be omitted.
#
# Objtypes are ones the shard-wide merged itemdesc already defines. testpkgs/misc/test_uomenu.src
# is what reads these back.
#

# Not an ItemMenu: read_menus() skips any other element type, and nothing else in the core
# reads this file, so this element exists only to be ignored.
Comment TestMenuNotes
{
    Note    menu ids are assigned in file order, starting at 1
}

ItemMenu
{
    NAME        TestMenuMain
    TITLE       Test Main Menu
    SubMenu     TestMenuSub 0x200001 Things in a box
    Entry       0xeed Gold coin
}

ItemMenu
{
    NAME        TestMenuSub
    TITLE       Test Sub Menu
    Entry       0xf3f Arrow
    Entry       0x06a5
}

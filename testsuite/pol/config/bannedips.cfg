#
# Address filter consulted on every incoming connection (is_banned_ip, bannedips.cpp).
#
# Without this file read_bannedips_config() returns at its FileExists check and banned_ips
# stays empty, so matches_any() never walks a filter.
#
# Nothing here may match the test client: it connects over the loopback interface, and a
# banned address is dropped before the login handshake. 192.0.2.0/24 is the RFC 5737
# documentation range, which is unroutable and reaches no shard, and 10.255.255.255 is the
# exact-match form (no '/' means the address must match exactly).
#

Banned
{
    IPMatch     192.0.2.0/255.255.255.0
}

Banned
{
    IPMatch     10.255.255.255
}

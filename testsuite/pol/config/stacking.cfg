#
# CProps that do not stop two otherwise identical items from stacking, shard-wide.
#
# Without this file load_stacking_cfg() (stackcfg.cpp) skips both its main-config branch and,
# with no package carrying one either, read_stacking_cfg() never runs at all.
#
# Item::can_add_to_self() subtracts this set from both items' property lists before comparing
# them, so an item carrying only TestStackIgnore still stacks with a plain one.
# testpkgs/item/stacking.cfg adds the per-package half of the same mechanism.
#

Stacking
{
    IgnoreCprops    TestStackIgnore
}

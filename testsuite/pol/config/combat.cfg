#
# WarmodeInhibitsRegen
# Determines if warmode stops vital regeneration and if so, what character types.
# Can be set to one of four values:
#   0 - None
#   1 - Both Players and NPCs
#   2 - Players Only
#   3 - NPCs Only
# Default is 0
#
WarmodeInhibitsRegen=3

#
# WarModeDelay: seconds a character must wait between war mode changes. Requests
#               inside the window are answered with a movement packet and leave
#               the mode unchanged.
# Default 1. Off here because the client tests change war mode constantly and
# every one of those changes otherwise costs a second of retrying. The throttle
# itself is covered by testpkgs/attack/test_warmode_delay.src, which turns it
# back on for the length of one test.
#
WarModeDelay=0

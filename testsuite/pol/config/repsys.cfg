# Reputation system settings for the test shard.
#
# None of this is reloadable. load_config() is only ever called at startup and
# reload_configuration() does not call it, so ReloadConfiguration() re-reads
# neither the timers below nor the colours - every value here holds for the whole
# run and is a single shard-wide choice. The HookList is skipped even on the
# startup reload path, so hooks cannot be swapped either.
#
#   CriminalFlagInterval  Kept far below the stock 120 so that the expiry cases in
#                         the TestRepsys package can watch a criminal timer run out
#                         instead of stalling the run. It bounds every criminal
#                         flag on the shard, so a test that wants to still be
#                         criminal a moment later has this long and no longer.
#   AggressorFlagTimeout  Same, and deliberately a different number: it is what
#                         tells the aggressor and lawfully-damaged timers apart
#                         from the criminal one when a case reads the seconds a
#                         list entry has left.
#   PartyHarmFullCountsAsCriminal
#                         Off, against a default of on. The party clause of
#                         Character::is_innocent_to only runs when this is off, so
#                         off is the only setting under which that clause can be
#                         covered at all - with it on the clause is dead code.
#                         Nothing outside TestRepsys puts two characters in a party
#                         and then has one damage the other.
#   PartyHelpFullCountsAsCriminal
#                         Off, which is the stock default, and already the setting
#                         that makes the matching clause of on_pc_helps_pc live.
#
# The NameColoring block is the stock one, value for value. TestClient's
# communication.inc hardcodes 44 / 68 / 90 for the guild and innocent colours, so
# these numbers are not free to move.

General
{
	CriminalFlagInterval	5
	AggressorFlagTimeout	3
	PartyHarmFullCountsAsCriminal	0
	PartyHelpFullCountsAsCriminal	0
}

# All five of them live in one script, which answers "no opinion" until a case
# arms it through a global property. They are installed for the whole run and
# cannot be unloaded, so nothing else may notice they are there: the two colour
# hooks are asked about every mobile in every packet that draws one.
HookList
{
	NameColor		:testrepsys:repsyshook:RepNameColorHook
	HighLightColor		:testrepsys:repsyshook:RepHighLightColorHook
	OnAttack		:testrepsys:repsyshook:RepOnAttackHook
	OnDamage		:testrepsys:repsyshook:RepOnDamageHook
	OnHelp			:testrepsys:repsyshook:RepOnHelpHook
}

NameColoring NameColoring
{
	Murderer		38
	Criminal		905
	Attackable		905
	Innocent		90

	GuildAlly		68
	GuildEnemy		44

	Invulnerable	53
}
